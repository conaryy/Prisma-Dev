services:
  gateway:
    image: nginx:1.25-alpine
    container_name: central-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-nginx
      - auth-frontend
      - auth-backend
      - logbook-frontend
      - k3-backend
      - keamanan-backend

  db:
    image: mysql:8.0
    container_name: k2s-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-k2s}
      MYSQL_USER: ${DB_USERNAME:-k2s}
      MYSQL_PASSWORD: ${DB_PASSWORD:-k2s_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-k2sR0ot12@}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-sso_auth}
      POSTGRES_USER: ${AUTH_DB_USER:-sso_auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-change_me_auth}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-sso_auth} -d ${AUTH_DB_NAME:-sso_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-init:
    build:
      context: ./K2S-Web-Project/backend
      dockerfile: Dockerfile
    container_name: k2s-backend-init
    restart: "no"
    environment: &k2s_backend_env
      APP_NAME: ${APP_NAME:-K2S}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${BACKEND_APP_URL:-https://apik2s.ryvidia.my.id}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-k2s}
      DB_USERNAME: ${DB_USERNAME:-k2s}
      DB_PASSWORD: ${DB_PASSWORD:-k2s_password}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://k2s.ryvidia.my.id,https://auth.ryvidia.my.id}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-k2s.ryvidia.my.id,auth.ryvidia.my.id}
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-1440}
      EXTERNAL_DNP_WRAPPER_URL: ${EXTERNAL_DNP_WRAPPER_URL:-http://wrapper:5001}
      EXTERNAL_DNP_WEB2_URL: ${EXTERNAL_DNP_WEB2_URL:-http://180.214.246.148}
      EXTERNAL_DNP_WRAPPER_INTERNAL_TOKEN: ${EXTERNAL_DNP_WRAPPER_INTERNAL_TOKEN}
      WHATSAPP_API_SERVICE_URL: ${WHATSAPP_API_SERVICE_URL:-http://whatsapp-api:5002}
      WHATSAPP_BOT_INTERNAL_TOKEN: ${WHATSAPP_BOT_INTERNAL_TOKEN:-change-me-whatsapp-bot-token}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      AUTH_MODE: ${AUTH_MODE:-local}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_AUDIENCE: ${SSO_AUDIENCE:-}
      SSO_JWKS_URL: ${SSO_JWKS_URL:-}
      SSO_AUTHORIZE_URL: ${SSO_AUTHORIZE_URL:-}
      SSO_TOKEN_URL: ${SSO_TOKEN_URL:-}
      SSO_END_SESSION_URL: ${SSO_END_SESSION_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_SCOPE: ${SSO_SCOPE:-openid profile email}
      SSO_CLOCK_SKEW: ${SSO_CLOCK_SKEW:-60}
      SSO_JWKS_CACHE_TTL: ${SSO_JWKS_CACHE_TTL:-300}
      SSO_SUB_CLAIM: ${SSO_SUB_CLAIM:-sub}
      SSO_EMAIL_CLAIM: ${SSO_EMAIL_CLAIM:-email}
      SSO_USERNAME_CLAIM: ${SSO_USERNAME_CLAIM:-preferred_username}
      SSO_NAME_CLAIM: ${SSO_NAME_CLAIM:-name}
      SSO_ADMIN_ROLES: ${SSO_ADMIN_ROLES:-admin,k2s_admin}
      SSO_VIEWER_ROLES: ${SSO_VIEWER_ROLES:-user,viewer,k2s_user,k2s_viewer}
      SSO_EXTERNAL_DNP_ROLES: ${SSO_EXTERNAL_DNP_ROLES:-external_dnp,k2s_external_dnp}
      SSO_PROVISION_USERS: ${SSO_PROVISION_USERS:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "php artisan migrate --force && if [ \"${SEED_ON_START}\" = \"true\" ]; then php artisan db:seed --force; else echo 'Skip db:seed (SEED_ON_START=false)'; fi",
      ]

  backend:
    build:
      context: ./K2S-Web-Project/backend
      dockerfile: Dockerfile
    container_name: k2s-backend
    restart: unless-stopped
    environment:
      <<: *k2s_backend_env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      wrapper:
        condition: service_started

  queue-worker:
    build:
      context: ./K2S-Web-Project/backend
      dockerfile: Dockerfile
    container_name: k2s-queue-worker
    restart: unless-stopped
    environment:
      <<: *k2s_backend_env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=3600",
      ]

  wrapper:
    build:
      context: ./K2S-Web-Project/backend/wrapping
      dockerfile: Dockerfile
    container_name: k2s-wrapper
    restart: unless-stopped
    environment:
      WRAPPER_SECRET_KEY: ${WRAPPER_SECRET_KEY:-super_secret_key_web1}
      WRAPPER_INTERNAL_TOKEN: ${EXTERNAL_DNP_WRAPPER_INTERNAL_TOKEN}
      WEB2_URL: ${EXTERNAL_DNP_WEB2_URL:-http://180.214.246.148}
      WRAPPER_HOST: 0.0.0.0
      WRAPPER_PORT: 5001
      WRAPPER_DEBUG: ${WRAPPER_DEBUG:-false}

  whatsapp-api:
    build:
      context: ./K2S-Web-Project/backend/whatsapp_api
      dockerfile: Dockerfile
    container_name: whatsapp-api
    restart: unless-stopped
    environment:
      WHATSAPP_BOT_HOST: ${WHATSAPP_BOT_HOST:-0.0.0.0}
      WHATSAPP_BOT_PORT: ${WHATSAPP_BOT_PORT:-5002}
      WHATSAPP_BOT_DEBUG: ${WHATSAPP_BOT_DEBUG:-false}
      WHATSAPP_BOT_BACKEND_URL: ${WHATSAPP_BOT_BACKEND_URL:-http://backend-nginx}
      WHATSAPP_BOT_INTERNAL_TOKEN: ${WHATSAPP_BOT_INTERNAL_TOKEN:-change-me-whatsapp-bot-token}
      WHATSAPP_BOT_MAX_ITEMS: ${WHATSAPP_BOT_MAX_ITEMS:-15}
      WHATSAPP_BOT_REQUEST_TIMEOUT: ${WHATSAPP_BOT_REQUEST_TIMEOUT:-30}
      WHATSAPP_BOT_DEDUP_TTL: ${WHATSAPP_BOT_DEDUP_TTL:-90}
      WHATSAPP_BOT_COMMAND_COOLDOWN: ${WHATSAPP_BOT_COMMAND_COOLDOWN:-300}
      WAHA_API_BASE_URL: ${WAHA_API_BASE_URL:-http://127.0.0.1:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION_NAME: ${WAHA_SESSION_NAME:-default}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
    depends_on:
      backend-nginx:
        condition: service_started

  backend-nginx:
    image: nginx:1.25-alpine
    container_name: k2s-backend-nginx
    restart: unless-stopped
    volumes:
      - ./K2S-Web-Project/backend:/var/www/html:ro
      - backend_storage:/var/www/html/storage
      - ./K2S-Web-Project/backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./K2S-Web-Project
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://apik2s.ryvidia.my.id}
        VITE_SSO_ENABLED: "true"
        VITE_SSO_AUTH_BASE_URL: ${SSO_ISSUER:-https://authapi.ryvidia.my.id}
        VITE_SSO_AUTHORIZE_URL: ${SSO_AUTHORIZE_URL:-https://authapi.ryvidia.my.id/oauth/authorize}
        VITE_SSO_TOKEN_URL: ${SSO_TOKEN_URL:-https://authapi.ryvidia.my.id/oauth/token}
        VITE_SSO_LOGOUT_URL: ${SSO_END_SESSION_URL:-https://authapi.ryvidia.my.id/auth/logout}
        VITE_SSO_CLIENT_ID: ${SSO_CLIENT_ID:-k2s-web}
        VITE_SSO_REDIRECT_URI: ${AUTH_DEFAULT_REDIRECT_URI:-https://k2s.ryvidia.my.id/auth/callback}
        VITE_SSO_SCOPE: ${SSO_SCOPE:-openid profile email}
        VITE_AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-https://auth.ryvidia.my.id}
        VITE_LOGBOOK_BASE_URL: ${AUTH_VITE_LOGBOOK_BASE_URL:-https://logbook.ryvidia.my.id}
        VITE_K3_BASE_URL: ${AUTH_VITE_K3_BASE_URL:-https://k3.ryvidia.my.id}
        VITE_KEAMANAN_BASE_URL: ${AUTH_VITE_KEAMANAN_BASE_URL:-https://keamanan.ryvidia.my.id}
    container_name: k2s-frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx

  auth-frontend:
    build:
      context: ./Auth
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${AUTH_VITE_API_BASE_URL:-https://authapi.ryvidia.my.id}
        VITE_SSO_AUTH_BASE_URL: ${AUTH_VITE_API_BASE_URL:-https://authapi.ryvidia.my.id}
        VITE_K2S_BASE_URL: ${AUTH_VITE_K2S_BASE_URL:-https://k2s.ryvidia.my.id}
        VITE_LOGBOOK_BASE_URL: ${AUTH_VITE_LOGBOOK_BASE_URL:-https://logbook.ryvidia.my.id}
        VITE_K3_BASE_URL: ${AUTH_VITE_K3_BASE_URL:-https://k3.ryvidia.my.id}
        VITE_KEAMANAN_BASE_URL: ${AUTH_VITE_KEAMANAN_BASE_URL:-https://keamanan.ryvidia.my.id}
    container_name: auth-frontend
    restart: unless-stopped

  auth-backend:
    build:
      context: ./Auth/backend
      dockerfile: Dockerfile
    container_name: auth-backend
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ${AUTH_JWK_HOST_PATH:-./deploy/secrets/auth-jwk.json}:/run/secrets/auth-jwk.json:ro
    environment:
      AUTH_PORT: 3104
      AUTH_BASE_URL: ${AUTH_BASE_URL:-https://authapi.ryvidia.my.id}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://authapi.ryvidia.my.id}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-k2s-platform}
      AUTH_LOGIN_UI_URL: ${AUTH_LOGIN_UI_URL:-https://auth.ryvidia.my.id/login}
      AUTH_JWK_PATH: ${AUTH_JWK_PATH:-/run/secrets/auth-jwk.json}
      AUTH_JWK_JSON: ${AUTH_JWK_JSON:-}
      AUTH_ALLOW_EPHEMERAL_JWK: ${AUTH_ALLOW_EPHEMERAL_JWK:-false}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://sso_auth:change_me_auth@auth-db:5432/sso_auth}
      AUTH_PG_SSL: ${AUTH_PG_SSL:-false}
      AUTH_DEFAULT_CLIENT_ID: ${AUTH_DEFAULT_CLIENT_ID:-k2s-web}
      AUTH_DEFAULT_CLIENT_SECRET: ${AUTH_DEFAULT_CLIENT_SECRET:-dev-secret-k2s}
      AUTH_DEFAULT_REDIRECT_URI: ${AUTH_DEFAULT_REDIRECT_URI:-https://k2s.ryvidia.my.id/auth/callback}
      AUTH_DEFAULT_POST_LOGOUT_URI: ${AUTH_DEFAULT_POST_LOGOUT_URI:-https://k2s.ryvidia.my.id/login}
      AUTH_LOGBOOK_CLIENT_ID: ${AUTH_LOGBOOK_CLIENT_ID:-logbook-web}
      AUTH_LOGBOOK_CLIENT_SECRET: ${AUTH_LOGBOOK_CLIENT_SECRET:-dev-secret-logbook}
      AUTH_LOGBOOK_REDIRECT_URI: ${AUTH_LOGBOOK_REDIRECT_URI:-https://logbook.ryvidia.my.id/auth/callback}
      AUTH_LOGBOOK_POST_LOGOUT_URI: ${AUTH_LOGBOOK_POST_LOGOUT_URI:-https://logbook.ryvidia.my.id/}
      AUTH_K3_CLIENT_ID: ${AUTH_K3_CLIENT_ID:-k3-web}
      AUTH_K3_CLIENT_SECRET: ${AUTH_K3_CLIENT_SECRET:-dev-secret-k3}
      AUTH_K3_REDIRECT_URI: ${AUTH_K3_REDIRECT_URI:-https://k3.ryvidia.my.id/auth/callback}
      AUTH_K3_POST_LOGOUT_URI: ${AUTH_K3_POST_LOGOUT_URI:-https://k3.ryvidia.my.id/}
      AUTH_KEAMANAN_CLIENT_ID: ${AUTH_KEAMANAN_CLIENT_ID:-keamanan-web}
      AUTH_KEAMANAN_CLIENT_SECRET: ${AUTH_KEAMANAN_CLIENT_SECRET:-dev-secret-keamanan}
      AUTH_KEAMANAN_REDIRECT_URI: ${AUTH_KEAMANAN_REDIRECT_URI:-https://keamanan.ryvidia.my.id/auth/callback}
      AUTH_KEAMANAN_POST_LOGOUT_URI: ${AUTH_KEAMANAN_POST_LOGOUT_URI:-https://keamanan.ryvidia.my.id/}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-https://auth.ryvidia.my.id,https://k2s.ryvidia.my.id,https://logbook.ryvidia.my.id,https://k3.ryvidia.my.id,https://keamanan.ryvidia.my.id}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-auth_sid}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-true}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_CODE_TTL_SECONDS: ${AUTH_CODE_TTL_SECONDS:-300}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_LOGIN_WINDOW_MS: ${AUTH_RATE_LIMIT_LOGIN_WINDOW_MS:-600000}
      AUTH_RATE_LIMIT_LOGIN_MAX_PER_IP: ${AUTH_RATE_LIMIT_LOGIN_MAX_PER_IP:-60}
      AUTH_RATE_LIMIT_LOGIN_MAX_PER_IDENTITY: ${AUTH_RATE_LIMIT_LOGIN_MAX_PER_IDENTITY:-20}
      AUTH_RATE_LIMIT_TOKEN_WINDOW_MS: ${AUTH_RATE_LIMIT_TOKEN_WINDOW_MS:-300000}
      AUTH_RATE_LIMIT_TOKEN_MAX_PER_IP: ${AUTH_RATE_LIMIT_TOKEN_MAX_PER_IP:-120}
      AUTH_RATE_LIMIT_TOKEN_MAX_PER_CLIENT: ${AUTH_RATE_LIMIT_TOKEN_MAX_PER_CLIENT:-60}
      AUTH_RATE_LIMIT_RESET_PASSWORD_WINDOW_MS: ${AUTH_RATE_LIMIT_RESET_PASSWORD_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_RESET_PASSWORD_MAX_PER_ACTOR: ${AUTH_RATE_LIMIT_RESET_PASSWORD_MAX_PER_ACTOR:-30}
      AUTH_K2S_USER_SYNC_URL: ${AUTH_K2S_USER_SYNC_URL:-http://backend-nginx/api/internal/auth/users/sync}
      AUTH_K2S_USER_SYNC_TOKEN: ${WHATSAPP_BOT_INTERNAL_TOKEN:-change-me-whatsapp-bot-token}
      AUTH_DEV_ADMIN_USERNAME: ${AUTH_DEV_ADMIN_USERNAME:-admin}
      AUTH_DEV_ADMIN_EMAIL: ${AUTH_DEV_ADMIN_EMAIL:-admin@local.test}
      AUTH_DEV_ADMIN_PASSWORD: ${AUTH_DEV_ADMIN_PASSWORD:-Admin123!}

  logbook-backend:
    build:
      context: ./Logbook/backend
      dockerfile: Dockerfile
    container_name: logbook-backend
    restart: unless-stopped
    depends_on:
      logbook-db:
        condition: service_healthy
    environment:
      PORT: ${LOGBOOK_BACKEND_PORT:-3105}
      DATABASE_URL: ${LOGBOOK_DATABASE_URL:-postgresql://logbook:logbook_password@logbook-db:5432/logbook?schema=public}
      CORS_ALLOW_ORIGINS: ${LOGBOOK_CORS_ALLOW_ORIGINS:-https://auth.ryvidia.my.id,https://logbook.ryvidia.my.id}
      SSO_ISSUER: ${LOGBOOK_SSO_ISSUER:-https://authapi.ryvidia.my.id}
      SSO_AUDIENCE: ${LOGBOOK_SSO_AUDIENCE:-k2s-platform}
      SSO_JWKS_URL: ${LOGBOOK_SSO_JWKS_URL:-https://authapi.ryvidia.my.id/.well-known/jwks.json}
      SSO_CLIENT_ID: ${LOGBOOK_SSO_CLIENT_ID:-logbook-web}
    command: ["sh", "-lc", "npx prisma db push && node dist/main.js"]

  logbook-frontend:
    build:
      context: ./Logbook/frontend
      dockerfile: Dockerfile
      args:
        VITE_LOGBOOK_API_BASE_URL: ${LOGBOOK_VITE_API_BASE_URL:-https://apilogbook.ryvidia.my.id/api/v1}
        VITE_AUTH_PORTAL_URL: ${LOGBOOK_VITE_AUTH_PORTAL_URL:-https://auth.ryvidia.my.id}
        VITE_SSO_ENABLED: ${LOGBOOK_VITE_SSO_ENABLED:-true}
        VITE_SSO_AUTH_BASE_URL: ${LOGBOOK_VITE_SSO_AUTH_BASE_URL:-https://authapi.ryvidia.my.id}
        VITE_SSO_AUTHORIZE_URL: ${LOGBOOK_VITE_SSO_AUTHORIZE_URL:-https://authapi.ryvidia.my.id/oauth/authorize}
        VITE_SSO_TOKEN_URL: ${LOGBOOK_VITE_SSO_TOKEN_URL:-https://authapi.ryvidia.my.id/oauth/token}
        VITE_SSO_LOGOUT_URL: ${LOGBOOK_VITE_SSO_LOGOUT_URL:-https://authapi.ryvidia.my.id/auth/logout}
        VITE_SSO_CLIENT_ID: ${LOGBOOK_VITE_SSO_CLIENT_ID:-logbook-web}
        VITE_SSO_REDIRECT_URI: ${LOGBOOK_VITE_SSO_REDIRECT_URI:-https://logbook.ryvidia.my.id/auth/callback}
        VITE_SSO_SCOPE: ${LOGBOOK_VITE_SSO_SCOPE:-openid profile email}
    container_name: logbook-frontend
    restart: unless-stopped
    depends_on:
      - logbook-backend

  logbook-db:
    image: postgres:16-alpine
    container_name: logbook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOGBOOK_DB_NAME:-logbook}
      POSTGRES_USER: ${LOGBOOK_DB_USER:-logbook}
      POSTGRES_PASSWORD: ${LOGBOOK_DB_PASSWORD:-logbook_password}
    volumes:
      - logbook_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOGBOOK_DB_USER:-logbook} -d ${LOGBOOK_DB_NAME:-logbook}"]
      interval: 10s
      timeout: 5s
      retries: 5

  k3-db:
    image: postgres:16-alpine
    container_name: k3-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${K3_DB_NAME:-k3_audit}
      POSTGRES_USER: ${K3_DB_USER:-k3}
      POSTGRES_PASSWORD: ${K3_DB_PASSWORD:-change_me_k3}
    volumes:
      - k3_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${K3_DB_USER:-k3} -d ${K3_DB_NAME:-k3_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  k3-backend:
    build:
      context: ./K3
      dockerfile: backend/Dockerfile
      args:
        VITE_SSO_AUTH_BASE_URL: ${K3_SSO_ISSUER:-https://authapi.ryvidia.my.id}
        VITE_SSO_AUTHORIZE_URL: ${SSO_AUTHORIZE_URL:-https://authapi.ryvidia.my.id/oauth/authorize}
        VITE_SSO_TOKEN_URL: ${SSO_TOKEN_URL:-https://authapi.ryvidia.my.id/oauth/token}
        VITE_SSO_LOGOUT_URL: ${SSO_END_SESSION_URL:-https://authapi.ryvidia.my.id/auth/logout}
        VITE_SSO_CLIENT_ID: ${AUTH_K3_CLIENT_ID:-k3-web}
        VITE_SSO_REDIRECT_URI: ${AUTH_K3_REDIRECT_URI:-https://k3.ryvidia.my.id/auth/callback}
        VITE_SSO_SCOPE: ${SSO_SCOPE:-openid profile email}
    container_name: k3-backend
    restart: unless-stopped
    depends_on:
      k3-db:
        condition: service_healthy
    environment:
      PORT: ${K3_PORT:-3106}
      DATABASE_URL: ${K3_DATABASE_URL:-postgresql://k3:change_me_k3@k3-db:5432/k3_audit?schema=public}
      SSO_ISSUER: ${K3_SSO_ISSUER:-https://authapi.ryvidia.my.id}
      SSO_JWKS_URL: ${K3_SSO_JWKS_URL:-https://authapi.ryvidia.my.id/.well-known/jwks.json}
      SSO_AUDIENCE: ${K3_SSO_AUDIENCE:-k2s-platform}
      GOOGLE_CLIENT_ID: ${K3_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${K3_GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${K3_GOOGLE_REDIRECT_URI:-https://apik3.ryvidia.my.id/api/google-drive/callback}
      GOOGLE_DRIVE_SCOPE: ${K3_GOOGLE_DRIVE_SCOPE:-https://www.googleapis.com/auth/drive}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${K3_GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_ROOT_FOLDER_NAME: ${K3_GOOGLE_DRIVE_ROOT_FOLDER_NAME:-K3 Evidence}
      K3_FRONTEND_BASE_URL: ${K3_FRONTEND_BASE_URL:-https://k3.ryvidia.my.id}

  keamanan-db:
    image: postgres:16-alpine
    container_name: keamanan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEAMANAN_DB_NAME:-keamanan}
      POSTGRES_USER: ${KEAMANAN_DB_USER:-keamanan}
      POSTGRES_PASSWORD: ${KEAMANAN_DB_PASSWORD:-change_me_keamanan}
    volumes:
      - keamanan_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEAMANAN_DB_USER:-keamanan} -d ${KEAMANAN_DB_NAME:-keamanan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keamanan-backend:
    build:
      context: ./Keamanan
      dockerfile: backend/Dockerfile
      args:
        VITE_API_BASE_URL: ${KEAMANAN_VITE_API_BASE_URL:-}
        VITE_AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-https://auth.ryvidia.my.id}
        VITE_PORTAL_DASHBOARD_URL: ${KEAMANAN_VITE_PORTAL_DASHBOARD_URL:-}
        VITE_PORTAL_KEAMANAN_URL: ${AUTH_VITE_KEAMANAN_BASE_URL:-https://keamanan.ryvidia.my.id}
        VITE_PORTAL_K3_URL: ${AUTH_VITE_K3_BASE_URL:-https://k3.ryvidia.my.id}
        VITE_PORTAL_K2S_URL: ${AUTH_VITE_K2S_BASE_URL:-https://k2s.ryvidia.my.id}
        VITE_SSO_ENABLED: ${KEAMANAN_VITE_SSO_ENABLED:-true}
        VITE_SSO_AUTH_BASE_URL: ${KEAMANAN_SSO_ISSUER:-https://authapi.ryvidia.my.id}
        VITE_SSO_AUTHORIZE_URL: ${KEAMANAN_SSO_AUTHORIZE_URL:-https://authapi.ryvidia.my.id/oauth/authorize}
        VITE_SSO_TOKEN_URL: ${KEAMANAN_SSO_TOKEN_URL:-https://authapi.ryvidia.my.id/oauth/token}
        VITE_SSO_LOGOUT_URL: ${KEAMANAN_SSO_LOGOUT_URL:-https://authapi.ryvidia.my.id/auth/logout}
        VITE_SSO_CLIENT_ID: ${AUTH_KEAMANAN_CLIENT_ID:-keamanan-web}
        VITE_SSO_REDIRECT_URI: ${AUTH_KEAMANAN_REDIRECT_URI:-https://keamanan.ryvidia.my.id/auth/callback}
        VITE_SSO_SCOPE: ${KEAMANAN_SSO_SCOPE:-openid profile email}
    container_name: keamanan-backend
    restart: unless-stopped
    depends_on:
      keamanan-db:
        condition: service_healthy
    environment:
      PORT: ${KEAMANAN_PORT:-3107}
      DATABASE_URL: ${KEAMANAN_DATABASE_URL:-postgresql://keamanan:change_me_keamanan@keamanan-db:5432/keamanan?schema=public}
      KEAMANAN_CORS_ALLOW_ORIGINS: ${KEAMANAN_CORS_ALLOW_ORIGINS:-https://keamanan.ryvidia.my.id,https://auth.ryvidia.my.id}
      KEAMANAN_ADMIN_ROLES: ${KEAMANAN_ADMIN_ROLES:-admin,keamanan_admin}
      SSO_ISSUER: ${KEAMANAN_SSO_ISSUER:-https://authapi.ryvidia.my.id}
      SSO_AUDIENCE: ${KEAMANAN_SSO_AUDIENCE:-k2s-platform}
      SSO_JWKS_URL: ${KEAMANAN_SSO_JWKS_URL:-https://authapi.ryvidia.my.id/.well-known/jwks.json}
      SSO_CLOCK_SKEW: ${KEAMANAN_SSO_CLOCK_SKEW:-60}
      SSO_JWKS_CACHE_TTL: ${KEAMANAN_SSO_JWKS_CACHE_TTL:-300}
    volumes:
      - keamanan_uploads:/app/backend/uploads

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    profiles: ["sso-local"]
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    profiles: ["sso-local"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123!}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--http-port=8080"]

volumes:
  db_data:
  auth_db_data:
  backend_storage:
  logbook_db_data:
  k3_db_data:
  keamanan_db_data:
  keamanan_uploads:
  keycloak_db_data:
