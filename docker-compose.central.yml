services:
  gateway:
    image: nginx:1.25-alpine
    container_name: central-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-nginx
      - auth-frontend

  db:
    image: mysql:8.0
    container_name: k2s-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-k2s}
      MYSQL_USER: ${DB_USERNAME:-k2s}
      MYSQL_PASSWORD: ${DB_PASSWORD:-k2s_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-k2sR0ot12@}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-init:
    build:
      context: ./K2S-Web-Project/backend
      dockerfile: Dockerfile
    container_name: k2s-backend-init
    restart: "no"
    environment: &k2s_backend_env
      APP_NAME: ${APP_NAME:-K2S}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${BACKEND_APP_URL:-https://api.example.com}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-k2s}
      DB_USERNAME: ${DB_USERNAME:-k2s}
      DB_PASSWORD: ${DB_PASSWORD:-k2s_password}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://k2s.example.com,https://auth.example.com}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-k2s.example.com,auth.example.com}
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-1440}
      EXTERNAL_DNP_WRAPPER_URL: ${EXTERNAL_DNP_WRAPPER_URL:-http://wrapper:5000}
      EXTERNAL_DNP_WEB2_URL: ${EXTERNAL_DNP_WEB2_URL:-http://180.214.246.148}
      EXTERNAL_DNP_WRAPPER_INTERNAL_TOKEN: ${EXTERNAL_DNP_WRAPPER_INTERNAL_TOKEN}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      AUTH_MODE: ${AUTH_MODE:-local}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_AUDIENCE: ${SSO_AUDIENCE:-}
      SSO_JWKS_URL: ${SSO_JWKS_URL:-}
      SSO_AUTHORIZE_URL: ${SSO_AUTHORIZE_URL:-}
      SSO_TOKEN_URL: ${SSO_TOKEN_URL:-}
      SSO_END_SESSION_URL: ${SSO_END_SESSION_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_SCOPE: ${SSO_SCOPE:-openid profile email}
      SSO_CLOCK_SKEW: ${SSO_CLOCK_SKEW:-60}
      SSO_JWKS_CACHE_TTL: ${SSO_JWKS_CACHE_TTL:-300}
      SSO_SUB_CLAIM: ${SSO_SUB_CLAIM:-sub}
      SSO_EMAIL_CLAIM: ${SSO_EMAIL_CLAIM:-email}
      SSO_USERNAME_CLAIM: ${SSO_USERNAME_CLAIM:-preferred_username}
      SSO_NAME_CLAIM: ${SSO_NAME_CLAIM:-name}
      SSO_ADMIN_ROLES: ${SSO_ADMIN_ROLES:-admin,k2s_admin}
      SSO_VIEWER_ROLES: ${SSO_VIEWER_ROLES:-user,viewer,k2s_user,k2s_viewer}
      SSO_EXTERNAL_DNP_ROLES: ${SSO_EXTERNAL_DNP_ROLES:-external_dnp,k2s_external_dnp}
      SSO_PROVISION_USERS: ${SSO_PROVISION_USERS:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "php artisan migrate --force && if [ \"${SEED_ON_START}\" = \"true\" ]; then php artisan db:seed --force; else echo 'Skip db:seed (SEED_ON_START=false)'; fi",
      ]

  backend:
    build:
      context: ./K2S-Web-Project/backend
      dockerfile: Dockerfile
    container_name: k2s-backend
    restart: unless-stopped
    environment:
      <<: *k2s_backend_env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      wrapper:
        condition: service_started

  queue-worker:
    build:
      context: ./K2S-Web-Project/backend
      dockerfile: Dockerfile
    container_name: k2s-queue-worker
    restart: unless-stopped
    environment:
      <<: *k2s_backend_env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=120",
      ]

  wrapper:
    build:
      context: ./K2S-Web-Project/backend/wrapping
      dockerfile: Dockerfile
    container_name: k2s-wrapper
    restart: unless-stopped
    environment:
      WRAPPER_SECRET_KEY: ${WRAPPER_SECRET_KEY:-super_secret_key_web1}
      WRAPPER_INTERNAL_TOKEN: ${EXTERNAL_DNP_WRAPPER_INTERNAL_TOKEN}
      WEB2_URL: ${EXTERNAL_DNP_WEB2_URL:-http://180.214.246.148}
      WRAPPER_HOST: 0.0.0.0
      WRAPPER_PORT: 5000
      WRAPPER_DEBUG: ${WRAPPER_DEBUG:-false}

  backend-nginx:
    image: nginx:1.25-alpine
    container_name: k2s-backend-nginx
    restart: unless-stopped
    volumes:
      - ./K2S-Web-Project/backend:/var/www/html:ro
      - backend_storage:/var/www/html/storage
      - ./K2S-Web-Project/backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./K2S-Web-Project
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.example.com}
    container_name: k2s-frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx

  auth-frontend:
    build:
      context: ./Auth
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${AUTH_VITE_API_BASE_URL:-https://api.example.com}
        VITE_K2S_BASE_URL: ${AUTH_VITE_K2S_BASE_URL:-https://k2s.example.com}
        VITE_LOGBOOK_BASE_URL: ${AUTH_VITE_LOGBOOK_BASE_URL:-https://logbook.example.com}
    container_name: auth-frontend
    restart: unless-stopped

  logbook-backend:
    build:
      context: ./Logbook/backend
      dockerfile: Dockerfile
    container_name: logbook-backend
    restart: unless-stopped
    profiles: ["logbook"]
    depends_on:
      logbook-db:
        condition: service_healthy
    environment:
      PORT: ${LOGBOOK_BACKEND_PORT:-3100}
      DATABASE_URL: ${LOGBOOK_DATABASE_URL:-postgresql://logbook:logbook_password@logbook-db:5432/logbook?schema=public}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://prisma.ryvidia.my.id,https://k2s.prisma.ryvidia.my.id,https://logbook.prisma.ryvidia.my.id}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_AUDIENCE: ${SSO_AUDIENCE:-}
      SSO_JWKS_URL: ${SSO_JWKS_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
    command: ["sh", "-lc", "npx prisma db push && node dist/main.js"]

  logbook-frontend:
    build:
      context: ./Logbook/frontend
      dockerfile: Dockerfile
      args:
        VITE_LOGBOOK_API_BASE_URL: ${LOGBOOK_VITE_API_BASE_URL:-/api/v1}
        VITE_AUTH_PORTAL_URL: ${LOGBOOK_VITE_AUTH_PORTAL_URL:-https://prisma.ryvidia.my.id/login}
    container_name: logbook-frontend
    restart: unless-stopped
    profiles: ["logbook"]
    depends_on:
      - logbook-backend

  logbook-db:
    image: postgres:16-alpine
    container_name: logbook-db
    restart: unless-stopped
    profiles: ["logbook"]
    environment:
      POSTGRES_DB: ${LOGBOOK_DB_NAME:-logbook}
      POSTGRES_USER: ${LOGBOOK_DB_USER:-logbook}
      POSTGRES_PASSWORD: ${LOGBOOK_DB_PASSWORD:-logbook_password}
    volumes:
      - logbook_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOGBOOK_DB_USER:-logbook} -d ${LOGBOOK_DB_NAME:-logbook}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    profiles: ["sso-local"]
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    profiles: ["sso-local"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123!}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--http-port=8080"]

volumes:
  db_data:
  backend_storage:
  logbook_db_data:
  keycloak_db_data:
