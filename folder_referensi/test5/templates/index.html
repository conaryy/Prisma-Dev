<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test5 Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 32px; background: #f5f7f9; color: #1d252c; }
        main { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #d9e0e6; border-radius: 8px; padding: 24px; }
        label { display: block; margin-top: 14px; font-weight: 700; }
        input, button { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button { margin-top: 18px; border: 0; border-radius: 6px; background: #1f7a5a; color: white; font-weight: 700; cursor: pointer; }
        img { display: block; margin-top: 8px; border: 1px solid #c7d0d9; }
    </style>
</head>
<body>
<main>
    <h1>Login DNP</h1>
    <form method="post" action="/login">
        <input type="hidden" name="ci_csrf_token" value="{{ meta.csrf }}">

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Captcha</label>
        <img src="/proxy-captcha?url={{ meta.captcha_url }}" width="164" alt="Captcha">
        <input type="text" name="captcha" required>

        <button type="submit">Masuk</button>
    </form>
</main>
</body>
</html>
