<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Search Logbook Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1117;
        --panel: #171a21;
        --panel-soft: #1d2330;
        --border: #2a3140;
        --text: #e6edf3;
        --muted: #9aa4b2;
        --accent: #4f8cff;
        --accent-hover: #6aa0ff;
      }

      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--text);
      }

      form {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }

      input {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      button {
        padding: 12px 18px;
        cursor: pointer;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }

      button:hover {
        background: var(--accent-hover);
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }

      .meta {
        color: var(--muted);
        font-size: 14px;
      }

      #status {
        margin-bottom: 16px;
        color: var(--muted);
      }

      .section {
        margin-top: 32px;
      }

      .answer {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel-soft);
        margin-bottom: 16px;
        white-space: pre-wrap;
      }

      #chat-status {
        color: var(--muted);
        margin-bottom: 16px;
      }

      .debug-log {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px 16px;
        margin-bottom: 16px;
        max-height: 240px;
        overflow: auto;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }

      .filter-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 12px;
      }

      select {
        padding: 12px;
        font-size: 16px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      h1,
      h2,
      h3 {
        color: var(--text);
      }

      p {
        color: var(--text);
      }

      @media (max-width: 720px) {
        .filter-grid {
          grid-template-columns: 1fr;
        }

        form {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <h1>Semantic Search Logbook</h1>
    <p>Ketik query bebas untuk search, atau ajukan pertanyaan agar backend mengambil konteks dari Qdrant lalu merangkum dengan model chat.</p>

    <form id="search-form">
      <input
        id="query"
        type="text"
        placeholder="Contoh: gangguan frekuensi tower atau call sign tertentu"
        required
      />
      <button type="submit">Cari</button>
    </form>

    <div id="status"></div>
    <div id="results"></div>

    <div class="section">
      <h2>Chat RAG</h2>
      <div class="filter-grid">
        <select id="chat-source">
          <option value="">Semua source</option>
          <option value="teknik">Teknik</option>
          <option value="tower">Tower</option>
          <option value="app">App</option>
        </select>
        <input id="chat-start-date" type="date" />
        <input id="chat-end-date" type="date" />
      </div>
      <form id="chat-form">
        <input
          id="question"
          type="text"
          placeholder="Contoh: rangkum kejadian penting"
          required
        />
        <button type="submit">Tanya</button>
      </form>

      <div id="chat-status"></div>
      <div id="chat-debug" class="debug-log"></div>
      <div id="chat-answer"></div>
      <div id="chat-sources"></div>
    </div>

    <script>
      const form = document.getElementById("search-form");
      const queryInput = document.getElementById("query");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const chatForm = document.getElementById("chat-form");
      const questionInput = document.getElementById("question");
      const chatSourceInput = document.getElementById("chat-source");
      const chatStartDateInput = document.getElementById("chat-start-date");
      const chatEndDateInput = document.getElementById("chat-end-date");
      const chatStatus = document.getElementById("chat-status");
      const chatDebug = document.getElementById("chat-debug");
      const chatAnswer = document.getElementById("chat-answer");
      const chatSources = document.getElementById("chat-sources");

      function appendDebugLine(message) {
        const line = document.createElement("div");
        line.textContent = message;
        chatDebug.appendChild(line);
        chatDebug.scrollTop = chatDebug.scrollHeight;
      }

      function renderCards(items) {
        return items
          .map(
            (item) => `
              <div class="card">
                <h3>${item.title}</h3>
                <p>${item.content || "-"}</p>
                <div class="meta">${item.subtitle || "-"}</div>
                <div class="meta">source: ${item.sourceType} | date: ${item.entryDate || "-"} | score: ${item.score.toFixed(4)}</div>
                ${
                  typeof item.semanticScore === "number"
                    ? `<div class="meta">debug: mode=${item.queryMode || "-"} | semantic=${item.semanticScore.toFixed(4)} | lexical=${(item.lexicalBoost || 0).toFixed(4)}</div>`
                    : ""
                }
              </div>
            `
          )
          .join("");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        status.textContent = "Mencari...";
        results.innerHTML = "";

        const response = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: queryInput.value })
        });

        const data = await response.json();

        if (!response.ok) {
          status.textContent = data.error || "Terjadi kesalahan.";
          return;
        }

        status.textContent = `Ditemukan ${data.results.length} hasil untuk "${data.query}"`;

        if (data.results.length === 0) {
          results.innerHTML = "<p>Tidak ada hasil.</p>";
          return;
        }

        results.innerHTML = renderCards(data.results);
      });

      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        chatStatus.textContent = "Memproses pertanyaan...";
        chatDebug.innerHTML = "";
        chatAnswer.innerHTML = "";
        chatSources.innerHTML = "";

        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: questionInput.value,
            sourceType: chatSourceInput.value,
            startDate: chatStartDateInput.value,
            endDate: chatEndDateInput.value
          })
        });

        if (!response.ok) {
          chatStatus.textContent = "Terjadi kesalahan.";
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();

          if (done) {
            break;
          }

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) {
              continue;
            }

            const eventData = JSON.parse(line);

            if (eventData.type === "status") {
              chatStatus.textContent = eventData.message || "Memproses pertanyaan...";
              appendDebugLine(`[${eventData.stage}] ${eventData.message}`);
              continue;
            }

            if (eventData.type === "error") {
              chatStatus.textContent = eventData.error || "Terjadi kesalahan.";
              appendDebugLine(`[error] ${eventData.details || eventData.error}`);
              continue;
            }

            if (eventData.type === "done") {
              chatStatus.textContent = `Jawaban untuk "${eventData.question}"`;
              appendDebugLine(`[done] mode=${eventData.retrievalMode} sources=${eventData.sources.length}`);
              chatAnswer.innerHTML = `<div class="answer">${eventData.answer || "-"}</div>`;

              if (!eventData.sources || eventData.sources.length === 0) {
                chatSources.innerHTML = "<p>Tidak ada sumber relevan.</p>";
                continue;
              }

              chatSources.innerHTML = `
                <h3>Sumber</h3>
                ${renderCards(eventData.sources)}
              `;
            }
          }
        }
      });
    </script>
  </body>
</html>
