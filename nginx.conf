server {
    listen 80;
    server_name _;
    # Allow larger upload bodies (PDF, etc.)
    client_max_body_size 64m;
    set $cors_origin "";

    if ($http_origin ~* "^https://([a-z0-9-]+\.)?(ryvidia|systennup|safetyairnavsub)\.(my\.id|com)$") {
        set $cors_origin $http_origin;
    }

    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|10\.[0-9.]+|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9.]+\.[0-9]+|192\.168\.[0-9.]+\.[0-9]+)(:[0-9]+)?$") {
        set $cors_origin $http_origin;
    }

    root /var/www/html/public;
    index index.php index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # Handle CORS preflight at Nginx level to avoid 405
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Requested-With, Authorization, Accept, Origin' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            add_header 'Vary' 'Origin' always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block direct storage access. File delivery should go through Laravel
    # endpoints that enforce auth / signed URLs.
    location ^~ /storage/ {
        return 404;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
