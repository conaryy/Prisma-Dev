# Central gateway for multi-app deployment.
# Point these production domains to this gateway host:
# - auth.ryvidia.my.id
# - authapi.ryvidia.my.id
# - k2s.ryvidia.my.id
# - apik2s.ryvidia.my.id
# - logbook.ryvidia.my.id
# - apilogbook.ryvidia.my.id
# - k3.ryvidia.my.id
# - apik3.ryvidia.my.id
# - keamanan.ryvidia.my.id
# - apikeamanan.ryvidia.my.id

server {
    listen 80 default_server;
    server_name _;

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name auth.ryvidia.my.id;

    location / {
        proxy_pass http://auth-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

