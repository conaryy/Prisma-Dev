<!DOCTYPE html>
<html>
<head>
    <title>Web 1 - Login Wrapper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card mx-auto" style="max-width: 400px;">
            <div class="card-body">
                <h4 class="text-center">Gateway Login</h4>
                <hr>
                <form action="/login" method="POST">
                    <input type="hidden" name="ci_csrf_token" value="{{ csrf }}">
                    
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Captcha</label>
                        <div class="mb-2">
                            <img src="/proxy-captcha?url={{ captcha_url }}" width="164">
                        </div>
                        <input type="text" name="captcha" class="form-control" placeholder="Input kode captcha" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Masuk Sekarang</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
