components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            success:
              type: boolean
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        remember:
          type: boolean
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token:
              type: string
            token_type:
              type: string
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UserCreateRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
        status:
          type: string
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
        status:
          type: string

    Instansi:
      type: object
      properties:
        id:
          type: string
        facilityGroup:
          type: string
        kobu:
          type: string
        bandara:
          type: string
        cabangAirnav:
          type: string
        name:
          type: string
        alias:
          type: string
        address:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        fax:
          type: string
        postalCode:
          type: string
        longitude:
          type: string
        latitude:
          type: string
        serviceArea:
          type: string
        operatingHours:
          type: string
        trafficType:
          type: string
        runwayCapacity:
          type: string
        runwayCondition:
          type: string
        location:
          type: string
    InstansiRequest:
      allOf:
        - $ref: '#/components/schemas/Instansi'
    InstansiResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Instansi'
    InstansiListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Instansi'

    Facility:
